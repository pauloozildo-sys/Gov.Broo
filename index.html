<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gov.Bro - Memory Club</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;color:#fff;font-family:'Rajdhani',sans-serif;touch-action:none}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom))}
.screen.active{display:flex}

h1{font-family:'Orbitron',sans-serif;font-size:2.2rem;color:#00f0ff;letter-spacing:4px;text-shadow:0 0 20px #00f0ff}
.sub{color:#cbd5e1;font-size:1rem;max-width:300px}
.tiny{color:#94a3b8;font-size:.75rem}

button{padding:14px 24px;font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:800;border:none;border-radius:14px;color:#000;cursor:pointer;background:linear-gradient(135deg,#00f0ff,#0088ff);box-shadow:0 0 22px rgba(0,240,255,.6);width:80%;max-width:320px}
button.b2{background:linear-gradient(135deg,#a855f7,#7c3aed);color:#fff;box-shadow:0 0 22px rgba(168,85,247,.6)}
button.ok{background:linear-gradient(135deg,#00ff88,#00cc66)}
button:active{transform:scale(.96)}
button.hide{display:none!important}

#msg{font-family:'Orbitron',sans-serif;font-size:.9rem;min-height:2.8em;color:#ffe600;max-width:320px;line-height:1.4}
#msg.bad{color:#ff3b6b}#msg.good{color:#00ff88}

.wrap{width:min(70vw,300px);aspect-ratio:1;position:relative}

/* ⭐ CÍRCULO */
#disc{
  width:100%;height:100%;border-radius:50%;overflow:hidden;
  border:6px solid #334155;
  box-shadow:0 0 30px rgba(51,65,85,.6);
  background:#0a0a18;position:relative;touch-action:none;
  transition:border-color 0.2s, box-shadow 0.2s;
}
#disc.perfect{border-color:#00ff88;box-shadow:0 0 40px rgba(0,255,136,.9)}
#disc.close{border-color:#ffe600;box-shadow:0 0 35px rgba(255,230,0,.8)}
#disc.far{border-color:#ff3b6b;box-shadow:0 0 25px rgba(255,59,107,.5)}

#pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;transform-origin:center center}

/* ⭐ QUADRO DE REFERÊNCIA (discreto) */
#face-guide{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:45%;height:55%;
  border:2px solid rgba(255,255,255,0.25);
  border-radius:6px;
  pointer-events:none;z-index:10;
}

#zoom{width:min(70vw,300px);accent-color:#00f0ff}

#chips{display:flex;gap:10px;justify-content:center}
.chip{font-family:'Orbitron',sans-serif;font-weight:800;padding:8px 14px;border-radius:10px;border:2px solid #334155;color:#64748b;transition:all 0.2s}
.chip.on{border-color:#ffe600;color:#ffe600;box-shadow:0 0 18px rgba(255,230,0,.7);background:rgba(255,230,0,0.1)}

#score{font-family:'Orbitron',sans-serif;color:#00ff88;text-shadow:0 0 8px rgba(0,255,136,.6);font-size:1rem}

/* ⭐ TIMER NO TOPO */
#timer-box{
  position:absolute;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:800;
  color:#ffe600;text-shadow:0 0 12px rgba(255,230,0,.8);
  background:rgba(0,0,0,0.7);padding:8px 20px;border-radius:20px;
  border:2px solid #ffe600;z-index:100;
}
#timer-box.urgent{color:#ff3b6b;border-color:#ff3b6b;text-shadow:0 0 12px rgba(255,59,107,.9);animation:pulse 0.5s infinite}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.08)}}

/* ⭐ EMOJI NO CANTO */
#emoji-box{
  position:absolute;bottom:20px;right:20px;
  font-size:3.5rem;
  filter:drop-shadow(0 0 20px rgba(255,255,255,0.4));
  transition:all 0.3s ease;
  z-index:100;
  pointer-events:none;
}
#emoji-box.pop{animation:emojiPop 0.4s ease-out}
@keyframes emojiPop{0%{transform:scale(0)}50%{transform:scale(1.3)}100%{transform:scale(1)}}

/* STATUS */
#status{
  font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:800;
  padding:6px 16px;border-radius:20px;white-space:nowrap;
  transition:all 0.2s;margin-top:6px;
}
#status.far{color:#ff3b6b;background:rgba(255,59,107,.15);border:1px solid #ff3b6b}
#status.close{color:#ffe600;background:rgba(255,230,0,.15);border:1px solid #ffe600}
#status.perfect{color:#00ff88;background:rgba(0,255,136,.15);border:1px solid #00ff88;animation:pulseSmall 0.6s infinite}
@keyframes pulseSmall{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
#status.hide{display:none}

.hide{display:none!important}
</style>
</head>
<body>

<!-- TELA INICIAL -->
<div id="start" class="screen active">
  <h1>🛂 GOV.BRO</h1>
  <p class="sub">Prove que é você. Ou não. Aqui errar também dá ponto.</p>
  <button id="cam">📷 TIRAR SELFIE</button>
  <button id="gal" class="b2">🖼️ ESCOLHER DA GALERIA</button>
  <p class="tiny">Paródia. Sem ligação com nenhum órgão do governo. A foto fica só no seu aparelho.</p>
  <input type="file" id="fcam" accept="image/*" capture="user" hidden>
  <input type="file" id="fgal" accept="image/*" hidden>
</div>

<!-- TELA DE JOGO -->
<div id="play" class="screen">

  <!-- ⭐ TIMER -->
  <div id="timer-box">⏱️ 60s</div>

  <!-- ⭐ EMOJI NO CANTO -->
  <div id="emoji-box">😭</div>

  <p id="msg"></p>

  <div class="wrap">
    <div id="disc">
      <img id="pic" alt="Seu rosto">
      <div id="face-guide"></div>
    </div>
  </div>

  <div id="status" class="far">🔴 Fora do enquadramento</div>

  <input type="range" id="zoom" min="0.5" max="2.2" step="0.01" value="1">

  <button id="validate" class="ok">OK!</button>

  <div id="chips">
    <div class="chip" data-v="10">+10</div>
    <div class="chip" data-v="20">+20</div>
    <div class="chip" data-v="50">+50</div>
  </div>

  <p id="score">PTS: 0</p>

  <button id="again" class="hide">🔄 DE NOVO</button>
  <button id="home" class="b2 hide">🏠 INÍCIO</button>
</div>

<script>
const $ = id => document.getElementById(id);
const disc = $('disc'), pic = $('pic'), msg = $('msg'), zoom = $('zoom'), status = $('status');
const emojiBox = $('emoji-box');
const timerBox = $('timer-box');
const chips = [...document.querySelectorAll('.chip')];
let x = 0, y = 0, s = 1, phase = 'start', round = 0, spinning = false;
let timeLeft = 60;
let timerInterval = null;

// ⭐ ZONAS DE ACERTO
const ZONA_PERFEITA_DIST = 0.08;
const ZONA_PERFEITA_ZOOM_MIN = 1.10;
const ZONA_PERFEITA_ZOOM_MAX = 1.25;
const ZONA_PERTO_DIST = 0.20;
const ZONA_PERTO_ZOOM_MIN = 0.90;
const ZONA_PERTO_ZOOM_MAX = 1.50;

// ⭐ EMOJIS
const EMOJI_FAR = '😭';
const EMOJI_CLOSE = '🤔';
const EMOJI_PERFECT_MAIN = '😍';
const EMOJI_PERFECT_SECOND = '👍';

function show(id){
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));
  $(id).classList.add('active');
}
function draw(){ pic.style.transform = `translate(${x}px,${y}px) scale(${s})`; }

// ===== FOTO =====
let photo = '';
function onFile(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    const im = new Image();
    im.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 800;
      const m = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,800,800);
      photo = c.toDataURL('image/jpeg',0.9);
      pic.src = photo; newRound(); show('play');
    };
    im.src = ev.target.result;
  };
  r.readAsDataURL(f); e.target.value = '';
}
$('cam').onclick = () => $('fcam').click();
$('gal').onclick = () => $('fgal').click();
$('fcam').onchange = onFile; $('fgal').onchange = onFile;

// ===== AVALIA PRECISÃO =====
function avaliarPrecisao(){
  const size = disc.clientWidth || 300;
  const dist = Math.hypot(x, y) / size;

  const noCentroPerfeito = dist < ZONA_PERFEITA_DIST;
  const noZoomPerfeito = s >= ZONA_PERFEITA_ZOOM_MIN && s <= ZONA_PERFEITA_ZOOM_MAX;

  if (noCentroPerfeito && noZoomPerfeito) return 'perfect';

  const noCentroPerto = dist < ZONA_PERTO_DIST;
  const noZoomPerto = s >= ZONA_PERTO_ZOOM_MIN && s <= ZONA_PERTO_ZOOM_MAX;

  if (noCentroPerto && noZoomPerto) return 'close';

  return 'far';
}

// ⭐ ATUALIZA BORDA + EMOJI + STATUS
function atualizarInterface(){
  if (phase !== 'adjust') return;

  const resultado = avaliarPrecisao();

  disc.classList.remove('far', 'close', 'perfect');
  status.classList.remove('far', 'close', 'perfect');

  disc.classList.add(resultado);
  status.classList.add(resultado);

  // Atualiza emoji (só se mudou)
  let novoEmoji = EMOJI_FAR;
  let segundoEmoji = '';

  if (resultado === 'perfect') {
    novoEmoji = EMOJI_PERFECT_MAIN;
    segundoEmoji = EMOJI_PERFECT_SECOND;
    status.textContent = '🟢 PERFEITO! Pode validar!';
  } else if (resultado === 'close') {
    novoEmoji = EMOJI_CLOSE;
    status.textContent = '🟡 Quase lá...';
  } else {
    novoEmoji = EMOJI_FAR;
    status.textContent = '🔴 Fora do enquadramento';
  }

  const emojiFinal = segundoEmoji ? novoEmoji + segundoEmoji : novoEmoji;

  if (emojiBox.textContent !== emojiFinal) {
    emojiBox.textContent = emojiFinal;
    emojiBox.classList.remove('pop');
    void emojiBox.offsetWidth;
    emojiBox.classList.add('pop');
  }
}

// ===== TIMER =====
function iniciarTimer(){
  clearInterval(timerInterval);
  timeLeft = 60;
  atualizarTimer();

  timerInterval = setInterval(() => {
    timeLeft--;
    atualizarTimer();

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      cancelarRodada();
    }
  }, 1000);
}

function atualizarTimer(){
  timerBox.textContent = `⏱️ ${timeLeft}s`;
  if (timeLeft <= 10) {
    timerBox.classList.add('urgent');
  } else {
    timerBox.classList.remove('urgent');
  }
}

function cancelarRodada(){
  phase = 'cancelled';
  clearInterval(timerInterval);
  msg.className = 'bad';
  msg.textContent = '⏰ Tempo esgotado! Recomeçando...';
  status.className = 'far';
  status.textContent = '⏰ Tempo esgotado';
  emojiBox.textContent = EMOJI_FAR;

  setTimeout(() => {
    newRound();
  }, 2000);
}

// ===== RODADA =====
function newRound(){
  phase = 'adjust';
  spinning = false;
  round++;

  const size = disc.clientWidth || 300;
  const ang = Math.random() * Math.PI * 2;
  const dist = size * (0.28 + Math.random() * 0.15);
  x = Math.cos(ang) * dist;
  y = Math.sin(ang) * dist;

  s = Math.random() < 0.5 ? 0.6 : 1.9;
  zoom.value = s;
  draw();

  disc.style.transition = 'none';
  disc.style.transform = 'rotate(0deg)';
  disc.style.transition = '';

  chips.forEach(c => c.classList.remove('on'));
  msg.className = '';
  msg.textContent = 'Ajuste o rosto até a borda ficar VERDE.';

  zoom.classList.remove('hide');
  $('validate').classList.remove('hide');
  $('again').classList.add('hide');
  $('home').classList.add('hide');

  emojiBox.textContent = EMOJI_FAR;

  // Inicia timer
  iniciarTimer();

  setTimeout(atualizarInterface, 50);
}

// ===== ARRASTAR =====
let drag = null;
disc.addEventListener('pointerdown', e => {
  if (phase === 'spin'){ spin(); return; }
  if (phase !== 'adjust') return;
  drag = {px: e.clientX, py: e.clientY, x, y};
  disc.setPointerCapture(e.pointerId);
});
disc.addEventListener('pointermove', e => {
  if (!drag) return;
  x = drag.x + (e.clientX - drag.px);
  y = drag.y + (e.clientY - drag.py);
  draw();
  atualizarInterface();
});
['pointerup','pointercancel'].forEach(t => disc.addEventListener(t, () => drag = null));

zoom.addEventListener('input', () => {
  s = parseFloat(zoom.value);
  draw();
  atualizarInterface();
});

// ===== VALIDAR (OK!) =====
$('validate').onclick = () => {
  if (phase !== 'adjust') return;

  clearInterval(timerInterval);

  const resultado = avaliarPrecisao();

  zoom.classList.add('hide');
  $('validate').classList.add('hide');

  if (resultado === 'perfect') {
    addScore(100);
    msg.className = 'good';
    msg.textContent = '✅ Rosto validado! +100 pontos!';
    tocarSom('win');
  } else if (resultado === 'close') {
    msg.className = '';
    msg.textContent = '🟡 Quase! Sem pontos extras.';
  } else {
    msg.className = 'bad';
    msg.textContent = '❌ Você não passa no teste do Gov.Bro!';
  }

  phase = 'spin';
  status.textContent = '🎰 Gire a roleta!';
  status.className = 'close';
};

// ===== ROLETA =====
function spin(){
  if (spinning) return;
  spinning = true;

  const r = Math.random();
  const prize = r < .5 ? 10 : r < .85 ? 20 : 50;
  const angle = (5 + Math.floor(Math.random() * 3)) * 360 + Math.random() * 360;

  disc.style.transition = 'transform 4s cubic-bezier(.12,.6,.1,1)';
  disc.style.transform = `rotate(${angle}deg)`;

  let i = 0;
  const t = setInterval(() => {
    chips.forEach((c, k) => c.classList.toggle('on', k === i % 3));
    i++;
  }, 90);

  setTimeout(() => {
    clearInterval(t);
    chips.forEach(c => c.classList.toggle('on', Number(c.dataset.v) === prize));
    addScore(prize);
    msg.className = 'good';
    msg.textContent = `🎉 +${prize} pontos!`;
    status.textContent = `🎉 Ganhou ${prize} pts!`;
    status.className = 'perfect';
    emojiBox.textContent = EMOJI_PERFECT_MAIN + EMOJI_PERFECT_SECOND;
    emojiBox.classList.remove('pop');
    void emojiBox.offsetWidth;
    emojiBox.classList.add('pop');

    phase = 'done';
    spinning = false;
    $('again').classList.remove('hide');
    $('home').classList.remove('hide');
  }, 4100);
}

// ===== PONTOS =====
let session = 0;
function addScore(n){
  session += n;
  $('score').textContent = `PTS: ${session}`;
  try {
    localStorage.setItem('memoryClub_totalScore',
      String(parseInt(localStorage.getItem('memoryClub_totalScore') || '0', 10) + n));
  } catch(e){}
}

// ===== SOM =====
const AudioContextClass = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio(){ if (!audioCtx) audioCtx = new AudioContextClass(); }

function tocarSom(tipo){
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  const now = audioCtx.currentTime;

  if (tipo === 'win') {
    osc.type = 'sine';
    [523.25, 659.25, 783.99, 1046.50].forEach((f, i) =>
      osc.frequency.setValueAtTime(f, now + i * 0.12));
    gain.gain.setValueAtTime(0.25, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.7);
    osc.start(now);
    osc.stop(now + 0.7);
  }
}

// ===== BOTÕES FINAIS =====
$('again').onclick = () => {
  session = 0;
  $('score').textContent = 'PTS: 0';
  newRound();
};

$('home').onclick = () => {
  clearInterval(timerInterval);
  phase = 'start';
  show('start');
  emojiBox.textContent = EMOJI_FAR;
};
</script>
</body>
</html>
